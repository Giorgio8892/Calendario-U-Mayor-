<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Académico Interactivo</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel para ejecutar JSX en el navegador -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Componentes de Iconos en SVG para evitar dependencias externas complejas
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            // Fecha de simulación: 24 de Abril de 2026
            const TODAY = new Date('2026-04-24T08:00:00');

            const subjects = [
                {
                    id: 'calculo',
                    name: 'Cálculo Integral',
                    icon: 'book-open',
                    evaluations: [
                        { name: 'Control 1', type: 'Control', dateStart: '2026-03-31', dateEnd: '2026-04-02', weight: '20% (Total Controles)' },
                        { name: 'Calificación Parcial 1', type: 'Cuestionario', dateStart: '2026-04-10', dateEnd: '2026-04-12', weight: '15%' },
                        { name: 'Control 2', type: 'Control', dateStart: '2026-04-24', dateEnd: '2026-04-26', weight: '20% (Total Controles)' },
                        { name: 'Calificación Parcial 3', type: 'Taller', dateStart: '2026-04-24', dateEnd: '2026-04-30', weight: '20%' },
                        { name: 'Calificación Parcial 2', type: 'Cuestionario', dateStart: '2026-05-02', dateEnd: '2026-05-04', weight: '15%' },
                        { name: 'Taller Recuperativo', type: 'Recuperativo', dateStart: '2026-05-12', dateEnd: '2026-05-12', weight: '-' },
                        { name: 'Control 3', type: 'Control', dateStart: '2026-05-15', dateEnd: '2026-05-17', weight: '20% (Total Controles)' },
                        { name: 'Control Recuperativo', type: 'Recuperativo', dateStart: '2026-05-19', dateEnd: '2026-05-19', weight: '-' },
                        { name: 'Calificación Parcial 5', type: 'Cuestionario', dateStart: '2026-05-22', dateEnd: '2026-05-24', weight: '30%' },
                        { name: 'Evaluación Recuperativa', type: 'Recuperativo', dateStart: '2026-05-26', dateEnd: '2026-05-26', weight: '-' },
                        { name: 'Examen Final', type: 'Examen', dateStart: '2026-05-30', dateEnd: '2026-05-31', weight: '30% Nota Final' },
                    ]
                },
                {
                    id: 'programacion',
                    name: 'Programación Aplicada',
                    icon: 'code',
                    evaluations: [
                        { name: 'EV 1 Sumativa', type: 'Trabajo Individual', dateStart: '2026-10-14', dateEnd: '2026-10-27', weight: '30%' },
                        { name: 'EV 2 Sumativa', type: 'Trabajo Individual', dateStart: '2026-11-11', dateEnd: '2026-11-24', weight: '35%' },
                        { name: 'EV 3 Sumativa', type: 'Trabajo Grupal', dateStart: '2026-12-02', dateEnd: '2026-12-12', weight: '35%' },
                        { name: 'Examen Obligatorio', type: 'Examen', dateStart: '2026-12-16', dateEnd: '2026-12-20', weight: '30% Nota Final' },
                    ]
                },
                {
                    id: 'negocios',
                    name: 'Modelos de Negocios',
                    icon: 'pie-chart',
                    evaluations: [
                        { name: 'EV Sumativa 1', type: 'Cuestionario', dateStart: '2026-03-24', dateEnd: '2026-04-06', weight: '30%' },
                        { name: 'EV Sumativa 2', type: 'Trabajo Grupal', dateStart: '2026-04-14', dateEnd: '2026-04-27', weight: '30%' },
                        { name: 'EV Sumativa 3', type: 'Trabajo Grupal', dateStart: '2026-05-12', dateEnd: '2026-05-23', weight: '40%' },
                        { name: 'Examen Obligatorio', type: 'Examen', dateStart: '2026-05-24', dateEnd: '2026-06-02', weight: '30% Nota Final' },
                    ]
                }
            ];

            const [filterSubject, setFilterSubject] = useState('all');
            const [filterStatus, setFilterStatus] = useState('all');

            const getStatus = (start, end) => {
                const startDate = new Date(start);
                const endDate = new Date(end);
                if (endDate < TODAY) return 'passed';
                const diffTime = startDate - TODAY;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if ((TODAY >= startDate && TODAY <= endDate) || (diffDays >= 0 && diffDays <= 7)) return 'soon';
                return 'future';
            };

            const getStatusConfig = (status) => {
                switch (status) {
                    case 'passed': return { color: 'bg-green-100 text-green-700 border-green-200', dot: 'bg-green-500', label: 'Realizada' };
                    case 'soon': return { color: 'bg-red-100 text-red-700 border-red-200', dot: 'bg-red-500', label: 'Próxima / Activa' };
                    default: return { color: 'bg-orange-100 text-orange-700 border-orange-200', dot: 'bg-orange-500', label: 'Faltante' };
                }
            };

            const allEvaluations = useMemo(() => {
                let list = [];
                subjects.forEach(sub => {
                    sub.evaluations.forEach(ev => {
                        list.push({ ...ev, subjectName: sub.name, subjectId: sub.id, status: getStatus(ev.dateStart, ev.dateEnd), subjectIcon: sub.icon });
                    });
                });
                return list.sort((a, b) => new Date(a.dateStart) - new Date(b.dateStart));
            }, []);

            const filteredList = useMemo(() => {
                return allEvaluations.filter(ev => {
                    const matchSubject = filterSubject === 'all' || ev.subjectId === filterSubject;
                    const matchStatus = filterStatus === 'all' || ev.status === filterStatus;
                    return matchSubject && matchStatus;
                });
            }, [allEvaluations, filterSubject, filterStatus]);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-4xl mx-auto">
                        <header className="mb-8">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                                <div>
                                    <h1 className="text-3xl font-extrabold text-gray-900 tracking-tight italic">ACADEMIC DASHBOARD</h1>
                                    <p className="text-gray-500 flex items-center gap-2 mt-1 font-medium">
                                        <Icon name="calendar" className="w-4 h-4" /> 
                                        Hoy: 24 de Abril, 2026
                                    </p>
                                </div>
                            </div>
                            
                            <div className="bg-white p-5 rounded-3xl shadow-xl border border-gray-100 space-y-4">
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] w-full mb-1">Filtrar por Materia</span>
                                    <button onClick={() => setFilterSubject('all')} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${filterSubject === 'all' ? 'bg-black text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>TODAS</button>
                                    {subjects.map(sub => (
                                        <button key={sub.id} onClick={() => setFilterSubject(sub.id)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${filterSubject === sub.id ? 'bg-black text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
                                            <Icon name={sub.icon} className="w-3 h-3" /> {sub.name.toUpperCase()}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex flex-wrap items-center gap-2 pt-4 border-t border-gray-50">
                                    <span className="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] w-full mb-1">Filtrar por Estado</span>
                                    <button onClick={() => setFilterStatus('all')} className={`px-4 py-2 rounded-xl text-xs font-bold ${filterStatus === 'all' ? 'bg-indigo-600 text-white' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'}`}>TODOS</button>
                                    <button onClick={() => setFilterStatus('soon')} className={`px-4 py-2 rounded-xl text-xs font-bold ${filterStatus === 'soon' ? 'bg-red-600 text-white' : 'bg-red-50 text-red-600 hover:bg-red-100'}`}>PRÓXIMAS</button>
                                    <button onClick={() => setFilterStatus('future')} className={`px-4 py-2 rounded-xl text-xs font-bold ${filterStatus === 'future' ? 'bg-orange-600 text-white' : 'bg-orange-50 text-orange-600 hover:bg-orange-100'}`}>FALTANTES</button>
                                    <button onClick={() => setFilterStatus('passed')} className={`px-4 py-2 rounded-xl text-xs font-bold ${filterStatus === 'passed' ? 'bg-green-600 text-white' : 'bg-green-50 text-green-600 hover:bg-green-100'}`}>REALIZADAS</button>
                                </div>
                            </div>
                        </header>

                        <div className="space-y-4 mb-10">
                            {filteredList.length > 0 ? (
                                filteredList.map((ev, idx) => {
                                    const cfg = getStatusConfig(ev.status);
                                    return (
                                        <div key={idx} className={`bg-white border-2 rounded-2xl p-5 transition-all hover:scale-[1.01] ${ev.status === 'soon' ? 'border-red-200 shadow-lg shadow-red-50' : 'border-gray-100'}`}>
                                            <div className="flex flex-col sm:flex-row justify-between gap-4">
                                                <div className="flex gap-4">
                                                    <div className={`p-3 rounded-2xl h-fit ${cfg.color.split(' ')[0]}`}>
                                                        <Icon name={ev.subjectIcon} className="w-5 h-5" />
                                                    </div>
                                                    <div>
                                                        <div className="flex items-center gap-2 mb-1">
                                                            <span className="text-[10px] font-extrabold text-gray-400 tracking-wider uppercase">{ev.subjectName}</span>
                                                            <span className={`px-2 py-0.5 rounded-lg text-[9px] font-black uppercase border ${cfg.color}`}>{cfg.label}</span>
                                                        </div>
                                                        <h3 className="text-lg font-bold text-gray-900 leading-tight">{ev.name}</h3>
                                                        <p className="text-sm text-gray-500 mt-1 flex items-center gap-1.5 font-medium">
                                                            <Icon name="clock" className="w-3.5 h-3.5" />
                                                            {new Date(ev.dateStart).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' })}
                                                            {ev.dateStart !== ev.dateEnd && ` - ${new Date(ev.dateEnd).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' })}`}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex sm:flex-col justify-between items-center sm:items-end gap-2 border-t sm:border-t-0 pt-3 sm:pt-0">
                                                    <span className="text-[10px] font-black bg-gray-100 text-gray-600 px-3 py-1.5 rounded-full uppercase tracking-tighter">POND: {ev.weight}</span>
                                                    <span className="text-[10px] font-bold text-gray-400 italic uppercase">{ev.type}</span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })
                            ) : (
                                <div className="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200">
                                    <Icon name="search-x" className="w-12 h-12 text-gray-200 mx-auto mb-4" />
                                    <p className="text-gray-400 font-bold uppercase tracking-widest text-sm">Sin resultados</p>
                                </div>
                            )}
                        </div>

                        <footer className="p-8 bg-black rounded-[2.5rem] text-white overflow-hidden relative">
                            <div className="relative z-10">
                                <h4 className="text-indigo-400 font-black text-xs tracking-[0.3em] mb-4 uppercase">Información de Seguridad</h4>
                                <div className="grid md:grid-cols-2 gap-8 text-sm text-gray-400 leading-relaxed">
                                    <div>
                                        <p className="mb-4 font-medium italic"><strong className="text-white not-italic">Regla de Oro:</strong> Se requiere nota $\geq$ 4.0 en exámenes finales de Cálculo y Programación para aprobar.</p>
                                        <p className="font-medium italic"><strong className="text-white not-italic">Integridad:</strong> Prohibido el uso de IA en Programación. Herramientas de proctoring activas.</p>
                                    </div>
                                    <div className="bg-gray-900/50 p-4 rounded-2xl border border-gray-800">
                                        <p className="font-bold text-white mb-2 underline decoration-indigo-500">Justificaciones</p>
                                        <p className="text-xs">Dispones de solo 2 a 3 días hábiles desde el término de la evaluación para justificar inasistencias vía formulario oficial.</p>
                                    </div>
                                </div>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
