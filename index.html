<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Académico - Giorgio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const App = () => {
            const TODAY = new Date('2026-04-24T08:00:00');
            const [filterSubject, setFilterSubject] = useState('all');

            const subjects = [
                { id: 'calculo', name: 'Cálculo Integral', color: 'blue', evaluations: [
                    { name: 'Control 2', start: '2026-04-24', weight: '20%' },
                    { name: 'Parcial 3 (Taller)', start: '2026-04-24', weight: '20%' },
                    { name: 'Parcial 2 (Cuest.)', start: '2026-05-02', weight: '15%' },
                    { name: 'Examen Final', start: '2026-05-30', weight: '30%' }
                ]},
                { id: 'programacion', name: 'Programación', color: 'purple', evaluations: [
                    { name: 'EV 1 Sumativa', start: '2026-10-14', weight: '30%' },
                    { name: 'Examen Obligatorio', start: '2026-12-16', weight: '30%' }
                ]},
                { id: 'negocios', name: 'Modelos Negocio', color: 'green', evaluations: [
                    { name: 'EV Sumativa 2', start: '2026-04-14', weight: '30%' },
                    { name: 'Examen Obligatorio', start: '2026-05-24', weight: '30%' }
                ]}
            ];

            const allEv = useMemo(() => {
                let list = [];
                subjects.forEach(s => s.evaluations.forEach(e => list.push({...e, subName: s.name, subId: s.id})));
                return list.sort((a,b) => new Date(a.start) - new Date(b.start));
            }, []);

            const filtered = allEv.filter(e => filterSubject === 'all' || e.subId === filterSubject);

            return (
                <div className="p-4 max-w-lg mx-auto font-sans">
                    <h1 className="text-2xl font-bold text-gray-800 mb-2 text-center">📅 Mi Calendario</h1>
                    <p className="text-sm text-center text-gray-500 mb-6">Ingeniería Industrial - Abril 2026</p>
                    
                    <div className="flex flex-wrap gap-2 mb-6 justify-center">
                        <button onClick={() => setFilterSubject('all')} className={`px-3 py-1 rounded-full text-xs font-bold ${filterSubject==='all'?'bg-black text-white':'bg-white border'}`}>Todas</button>
                        {subjects.map(s => (
                            <button key={s.id} onClick={() => setFilterSubject(s.id)} className={`px-3 py-1 rounded-full text-xs font-bold ${filterSubject===s.id?'bg-blue-600 text-white':'bg-white border'}`}>{s.name}</button>
                        ))}
                    </div>

                    <div className="space-y-3">
                        {filtered.map((ev, i) => (
                            <div key={i} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                                <div className="text-[10px] font-bold text-blue-500 uppercase">{ev.subName}</div>
                                <div className="font-bold text-gray-800">{ev.name}</div>
                                <div className="flex justify-between items-center mt-2">
                                    <span className="text-xs text-gray-500">📅 {ev.start}</span>
                                    <span className="bg-gray-100 text-[10px] px-2 py-1 rounded font-bold">{ev.weight}</span>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-10 p-4 bg-gray-800 rounded-xl text-white text-[11px]">
                        <p className="font-bold text-yellow-400 mb-1">⚠️ Recordatorio:</p>
                        <p>Cálculo: Examen ≥ 4.0 para aprobar.</p>
                        <p>Programación: Control estricto de IA.</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
